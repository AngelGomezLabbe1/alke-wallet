<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Wallet - Últimos movimientos</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link
        rel="stylesheet"
        href="../CSS/styles.css"
    >

</head>


<body class="bg-light">


    <!-- ENCABEZADO -->

    <header class="bg-primary text-white py-3">

        <div class="container">

            <div
                class="d-flex justify-content-between align-items-center"
            >

                <h3 class="mb-0">
                    💳 Mi Wallet
                </h3>

                <a
                    href="menu.html"
                    class="btn btn-light btn-sm"
                >
                    Menú
                </a>

            </div>

        </div>

    </header>


    <!-- CONTENIDO -->

    <main class="container py-5">


        <!-- TÍTULO -->

        <div class="text-center mb-4">

            <h1>
                Últimos movimientos
            </h1>

            <p class="text-muted">
                Revisa las operaciones realizadas en tu wallet.
            </p>

        </div>


        <!-- ALERTAS -->

        <div id="alert-container"></div>


        <!-- FILTRO -->

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <label
                    for="filtroTipo"
                    class="form-label fw-bold"
                >
                    Filtrar movimientos
                </label>


                <select
                    id="filtroTipo"
                    class="form-select"
                >

                    <option value="todos">
                        Todos los movimientos
                    </option>

                    <option value="deposito">
                        Depósitos
                    </option>

                    <option value="retiro">
                        Retiros
                    </option>

                    <option value="transferencia_enviada">
                        Transferencias enviadas
                    </option>

                    <option value="transferencia_recibida">
                        Transferencias recibidas
                    </option>

                    <option value="compra">
                        Compras
                    </option>

                </select>

            </div>

        </div>


        <!-- HISTORIAL -->

        <div class="card shadow-sm">

            <div class="card-body">

                <h5 class="card-title mb-3">
                    📋 Historial
                </h5>


                <div id="listaMovimientos">

                </div>

            </div>

        </div>


        <!-- VOLVER -->

        <div class="text-center mt-4">

            <a
                href="menu.html"
                class="btn btn-primary"
            >
                ← Volver al menú
            </a>

        </div>

    </main>


    <!-- JQUERY -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
    ></script>


    <!-- BOOTSTRAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- WALLET.JS -->

    <script src="../JS/wallet.js"></script>


</body>

</html>
