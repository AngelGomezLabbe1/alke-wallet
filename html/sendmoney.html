<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Wallet - Enviar dinero</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../CSS/styles.css">

</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        💸 Enviar dinero
                    </h2>

                    <!-- SALDO -->

                    <div class="alert alert-info text-center">

                        Saldo disponible:

                        <strong id="saldoActual">
                            $0
                        </strong>

                    </div>

                    <!-- ALERTAS -->

                    <div id="alert-container"></div>


                    <!-- BUSCAR CONTACTO -->

                    <div class="mb-4">

                        <label
                            for="buscarContacto"
                            class="form-label fw-bold"
                        >
                            Buscar contacto
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="buscarContacto"
                            placeholder="Buscar por nombre o alias"
                        >

                    </div>


                    <!-- CONTACTOS -->

                    <h5 class="mb-3">
                        👥 Contactos
                    </h5>

                    <div
                        id="listaContactos"
                        class="list-group mb-3"
                    >

                        <button
                            type="button"
                            class="list-group-item list-group-item-action contacto"
                            data-nombre="Juan Pérez"
                            data-alias="juanp"
                            data-cbu="123456789"
                        >

                            <strong>
                                Juan Pérez
                            </strong>

                            <br>

                            <small>
                                @juanp
                            </small>

                        </button>


                        <button
                            type="button"
                            class="list-group-item list-group-item-action contacto"
                            data-nombre="María González"
                            data-alias="mariag"
                            data-cbu="987654321"
                        >

                            <strong>
                                María González
                            </strong>

                            <br>

                            <small>
                                @mariag
                            </small>

                        </button>


                        <button
                            type="button"
                            class="list-group-item list-group-item-action contacto"
                            data-nombre="Pedro Soto"
                            data-alias="pedros"
                            data-cbu="456789123"
                        >

                            <strong>
                                Pedro Soto
                            </strong>

                            <br>

                            <small>
                                @pedros
                            </small>

                        </button>

                    </div>


                    <!-- AGREGAR CONTACTO -->

                    <button
                        type="button"
                        id="btnAgregarContacto"
                        class="btn btn-outline-primary mb-3"
                    >
                        ➕ Agregar nuevo contacto
                    </button>


                    <!-- FORMULARIO NUEVO CONTACTO -->

                    <div
                        id="formNuevoContacto"
                        class="card p-3 mb-3"
                        style="display: none;"
                    >

                        <h5>
                            Nuevo contacto
                        </h5>

                        <form id="nuevoContactoForm">

                            <div class="mb-2">

                                <label
                                    for="nuevoNombre"
                                    class="form-label"
                                >
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    id="nuevoNombre"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="mb-2">

                                <label
                                    for="nuevoAlias"
                                    class="form-label"
                                >
                                    Alias
                                </label>

                                <input
                                    type="text"
                                    id="nuevoAlias"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="nuevoCBU"
                                    class="form-label"
                                >
                                    RUT
                                </label>

                                <input
                                    type="text"
                                    id="nuevoCBU"
                                    class="form-control"
                                    placeholder="Ej: 12.345.678-9"
                                    required
                                >

                                <div class="form-text">
                                    Ingresa el RUT del contacto.
                                </div>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Guardar contacto
                            </button>


                            <button
                                type="button"
                                id="btnCancelarContacto"
                                class="btn btn-secondary"
                            >
                                Cancelar
                            </button>

                        </form>

                    </div>


                    <!-- FORMULARIO ENVÍO -->

                    <div
                        id="formEnvio"
                        style="display: none;"
                    >

                        <hr>

                        <h5 class="mb-3">

                            💰 Enviar dinero a:

                            <span
                                id="contactoSeleccionado"
                                class="text-primary"
                            ></span>

                        </h5>


                        <form id="sendMoneyForm">

                            <div class="mb-3">

                                <label
                                    for="montoEnvio"
                                    class="form-label"
                                >
                                    Monto a enviar
                                </label>

                                <input
                                    type="number"
                                    id="montoEnvio"
                                    class="form-control"
                                    min="1"
                                    placeholder="Ej: 50000"
                                    required
                                >

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                💸 Enviar dinero
                            </button>

                        </form>

                    </div>


                    <!-- VOLVER -->

                    <a
                        href="menu.html"
                        class="btn btn-outline-secondary w-100 mt-4"
                    >
                        ← Volver al menú
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- JQUERY -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- BOOTSTRAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JAVASCRIPT DE LA WALLET -->

    <script src="../JS/wallet.js"></script>

</body>

</html>
