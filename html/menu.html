<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Wallet - Menú principal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../CSS/styles.css">

</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="text-center mb-4">

            <h1>💼 Mi Wallet</h1>

            <p class="text-muted">
                Menú principal
            </p>

        </div>

        <!-- SALDO -->

        <div class="card shadow mb-4">

            <div class="card-body text-center">

                <h5>Saldo disponible</h5>

                <h2 id="saldoActual" class="text-success">
                    $0
                </h2>

            </div>

        </div>

        <!-- ALERTA -->

        <div id="alert-container"></div>

        <!-- BOTONES -->

        <div class="row g-3">

            <!-- DEPOSITAR -->

            <div class="col-md-3">

                <button
                    id="btnDepositar"
                    class="btn btn-success w-100 p-3"
                >
                    💰 Depositar
                </button>

            </div>

            <!-- ENVIAR -->

            <div class="col-md-3">

                <button
                    id="btnEnviar"
                    class="btn btn-primary w-100 p-3"
                >
                    💸 Enviar dinero
                </button>

            </div>

            <!-- RETIRAR -->

            <div class="col-md-3">

                <button
                    id="btnRetirar"
                    class="btn btn-warning w-100 p-3"
                >
                    💵 Retirar dinero
                </button>

            </div>

            <!-- MOVIMIENTOS -->

            <div class="col-md-3">

                <button
                    id="btnMovimientos"
                    class="btn btn-secondary w-100 p-3"
                >
                    📋 Últimos movimientos
                </button>

            </div>

        </div>

    </div>

    <!-- JQUERY -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- BOOTSTRAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JAVASCRIPT DEL PROYECTO -->

    <script src="../JS/wallet.js"></script>

</body>

</html>
